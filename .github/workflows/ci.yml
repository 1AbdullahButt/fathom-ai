# Gate every pull request: type checks, lint, tests, production build (matches 8x's repo standard).
# e2e runs as its own step after check, against the production build (DECISIONS.md).
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --pass-with-no-tests
